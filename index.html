<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d8f0df"><title>小猫游戏多</title>
<style>*{box-sizing:border-box}body{margin:0;background:#c5e3ce;font-family:system-ui;color:#42614b;overflow:hidden}#game{position:relative;width:100vw;height:100dvh;display:block}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;min-width:0;min-height:0;outline:0}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:#d8f0df;z-index:2}#loading::before{content:"";position:absolute;width:min(110vw,600px);height:80vh;border-radius:48%;background:#f6f6e7;z-index:-1;transform:rotate(-9deg)}#brand{width:min(80vw,360px);height:auto}#cat{width:240px;height:207px;background:url(cat.png) 0 0 / 400% 400%;border:0;cursor:pointer}#cat:active{background-position:66.667% 66.667%}.progress{width:min(75vw,320px)}.caption{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:13px}#track{height:23px;border:2px solid #4e6b50;border-radius:15px;padding:3px;background:#fff9e9;box-shadow:0 3px 0 #90b19a}#bar{height:100%;width:0;background:#edb75b;border-radius:12px;transition:width .2s;box-shadow:inset 0 3px #ffda8a}#retry{padding:12px 28px;background:#ffe29a;color:#42614b;border:2px solid #4e6b50;border-radius:14px;font-weight:700}#retry[hidden]{display:none}#sound{position:absolute;bottom:22px;right:22px;background:#eff7e9;border:2px solid #97baa2;border-radius:22px;padding:12px;color:#42614b;font-weight:700}#sound[hidden]{display:none}@media(max-height:650px){#loading{gap:12px}#brand{width:210px}#cat{width:170px;height:146px}}@media(prefers-reduced-motion:reduce){#bar{transition:none}}</style></head><body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="小猫游戏多"></canvas><section id="loading"><img id="brand" src="title.png" alt="小猫游戏多"><button id="cat" aria-label="摸摸小猫"></button><div class="progress"><div class="caption"><span id="status">正在开门…</span><span id="percent">0%</span></div><div id="track" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div></div><button id="retry" hidden>重试</button><button id="sound" hidden>开启音乐</button><a href="audio-credits.html" target="_blank" rel="noopener" style="font-size:12px;color:#42614b">声音署名</a></section></main>
<script>
const music=new Audio('cat-bgm.mp3');music.loop=true;music.volume=.16;const sound=document.getElementById('sound');let ended=false;
function startMusic(){if(ended)return;try{if(localStorage.getItem('cat-unity-muted')==='1')return}catch{}music.play().then(()=>sound.hidden=true).catch(()=>sound.hidden=false)}
startMusic();document.addEventListener('pointerdown',startMusic,{passive:true});sound.onclick=startMusic;
document.addEventListener('visibilitychange',()=>{if(document.hidden)music.pause();else startMusic()});
const loader=document.createElement('script');loader.src='Build/Web.loader.js?v=0e0a5f95fff2';loader.onload=()=>createUnityInstance(document.getElementById('unity-canvas'),{dataUrl:'Build/Web.data.unityweb?v=a9de4e4534f1',frameworkUrl:'Build/Web.framework.js.unityweb?v=fe77351dd475',codeUrl:'Build/Web.wasm.unityweb?v=afff4a87e865',streamingAssetsUrl:'StreamingAssets',companyName:'CatGames',productName:'小猫游戏多',productVersion:'1.0.0',autoSyncPersistentDataPath:true,devicePixelRatio:Math.min(2,devicePixelRatio)},p=>{const n=Math.round(p*100);document.getElementById('percent').textContent=n+'%';document.getElementById('bar').style.width=n+'%';document.getElementById('track').setAttribute('aria-valuenow',n)}).then(game=>{ended=true;music.pause();document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';document.getElementById('unity-canvas').focus()}).catch(fail);
function fail(error){console.error(error);document.getElementById('status').textContent='加载失败，请重试';document.getElementById('retry').hidden=false}loader.onerror=fail;document.getElementById('retry').onclick=()=>location.reload();document.body.append(loader);
</script></body></html>
