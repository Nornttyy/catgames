<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b7e4ce"><meta name="description" content="选一只大眼猫，桌子捣蛋、偷吃鱼干、小猫跳一跳、猫猫跑酷赛、猫咪大乱斗。"><title>小猫游戏多</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="home.css?v=controls-7"><link rel="stylesheet" href="jump.css"><link rel="stylesheet" href="race.css"><link rel="stylesheet" href="polish.css?v=controls-7"><link rel="stylesheet" href="brawl.css?v=controls-7"><link rel="stylesheet" href="loading.css?v=controls-7"><link rel="stylesheet" href="match.css?v=controls-7"><link rel="stylesheet" href="controls.css?v=controls-7"></head>
<body>
<main id="game" aria-label="小猫游戏多">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="icon-paw" viewBox="0 0 32 32"><ellipse cx="7" cy="11" rx="4" ry="5" transform="rotate(-20 7 11)"/><ellipse cx="15" cy="7" rx="4" ry="5"/><ellipse cx="24" cy="10" rx="4" ry="5" transform="rotate(20 24 10)"/><path d="M8 21c1-4 4-7 8-7s7 3 9 7c3 8-4 8-8 6-5 3-12 2-9-6Z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="icon-left" viewBox="0 0 24 24"><path d="m11 5-7 7 7 7M4 12h16"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><path d="m13 5 7 7-7 7M4 12h16"/></symbol>
    <symbol id="icon-jump" viewBox="0 0 24 24"><path d="M4 20h16M12 16V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="icon-slide" viewBox="0 0 24 24"><path d="M4 10V4h16v6M12 9v11m-5-5 5 5 5-5"/></symbol>
    <symbol id="icon-boost" viewBox="0 0 24 24"><path d="m14 2-9 12h6l-1 8 9-12h-6Z"/></symbol>
    <symbol id="icon-cup" viewBox="0 0 32 32"><path d="M9 5h14v10a7 7 0 0 1-14 0ZM9 8H4v4c0 4 3 5 6 5m13-9h5v4c0 4-3 5-6 5M16 22v5m-6 1h12"/><path d="m16 8 1.5 3 3 .5-2.2 2.1.5 3-2.8-1.4-2.8 1.4.5-3-2.2-2.1 3-.5Z"/></symbol>
  </defs></svg>
  <canvas id="scene" aria-label="猫猫和桌子" tabindex="0"></canvas>
  <canvas id="feedback" aria-hidden="true"></canvas>
  <div id="loading" class="layer">
    <img class="loading-brand" src="assets/title-catgames.png" alt="小猫游戏多">
    <div class="loading-stage"><button id="loading-cat" aria-label="摸摸小猫"><span class="loading-cat-frame"></span><svg class="loading-cat-fallback" aria-hidden="true"><use href="#icon-paw"/></svg></button><img class="loading-snack" src="assets/fish-snack.png" alt=""></div>
    <div class="loading-progress"><div class="loading-caption"><span id="load-label">正在开门…</span><b id="load-value">0%</b></div><div id="load-progress" class="loading-track" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="load-fill"></div></div><button id="retry-load" hidden>重试</button></div>
    <button id="sound-loading" class="sound">♫ 音乐</button>
  </div>
  <section id="home" class="layer" hidden>
    <header class="home-brand"><h1><img src="assets/title-catgames.png" alt="小猫游戏多" width="924" height="572" decoding="async" fetchpriority="high"></h1></header>
    <button id="learn" class="round home-help" aria-label="怎么玩">?</button>
    <button id="sound-home" class="round sound" aria-label="关闭声音">♫</button>
    <button id="home-cat" class="home-cat" aria-label="选择猫咪毛色"></button>
    <button id="wardrobe" class="home-wardrobe"><span class="fur-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>换只猫</span></button>
    <div class="game-select" role="group" aria-label="选择小游戏">
      <button class="game-card" data-game="table" aria-pressed="false"><span class="game-check" aria-hidden="true">✓</span><span class="game-art" aria-hidden="true"><img class="toy-books" src="assets/books-side.png" alt=""><img class="toy-mug" src="assets/mug-side.png" alt=""><i class="toy-lines"></i></span><strong>桌子捣蛋</strong><small data-record="table">纪录 0</small></button>
      <button class="game-card" data-game="fish" aria-pressed="true"><span class="game-check" aria-hidden="true">✓</span><span class="game-art" aria-hidden="true"><img class="toy-fish" src="assets/fish-snack.png" alt=""><i class="toy-lines"></i></span><strong>偷吃鱼干</strong><small data-record="fish">纪录 0</small></button>
      <button class="game-card" data-game="jump" aria-pressed="false"><span class="game-check" aria-hidden="true">✓</span><span class="game-art" aria-hidden="true"><span class="toy-jump-cat"></span><img class="toy-jump-spikes" src="assets/jump-spikes.png" alt=""></span><strong>小猫跳一跳</strong><small data-record="jump">纪录 0</small></button>
      <button class="game-card" data-game="race" aria-pressed="false"><span class="game-check" aria-hidden="true">✓</span><span class="game-art" aria-hidden="true"><span class="toy-race-cat"></span><i class="race-flag"></i></span><strong>猫猫跑酷赛</strong><small data-record="race">3 猫同跑 · 人机</small></button>
      <button class="game-card" data-game="brawl" aria-pressed="false"><span class="game-check" aria-hidden="true">✓</span><span class="game-art brawl-toy" aria-hidden="true"><i class="toy-brawl-cat one"></i><i class="toy-brawl-cat two"></i><svg class="icon"><use href="#icon-boost"/></svg></span><strong>猫咪大乱斗</strong><small data-record="brawl">6 猫混战 · 人机</small></button>
    </div>
    <button id="shelf-next" class="shelf-next" aria-label="切换小游戏">›</button>
    <div class="shelf-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="start" class="primary">去偷吃 <span aria-hidden="true">▶</span></button>
  </section>
  <section id="picker" class="layer" hidden aria-label="猫猫毛色与动作">
    <div class="picker-head"><button id="close-picker" class="round" aria-label="返回主页">‹</button><h2>挑一只猫</h2><span></span></div>
    <div class="picker-bottom"><div class="colors" role="group" aria-label="选择毛色">
      <button data-color="gray" aria-pressed="true"><i style="--fur:#b3ada5"></i>灰白</button><button data-color="orange" aria-pressed="false"><i style="--fur:#ffb653"></i>橘白</button><button data-color="cream" aria-pressed="false"><i style="--fur:#fff2cf"></i>奶白</button><button data-color="black" aria-pressed="false"><i style="--fur:#34343d"></i>黑猫</button>
    </div><div class="motions" role="group" aria-label="预览动作"><button data-motion="idle" aria-pressed="true">发呆</button><button data-motion="walk" aria-pressed="false">走路</button><button data-motion="push" aria-pressed="false">出爪</button><button data-motion="hide" aria-pressed="false">躲好</button></div><button id="select-cat" class="primary">就选这只</button></div>
  </section>
  <section id="play" class="layer" hidden aria-label="桌子捣蛋">
    <div class="hud"><div class="score"><small>捣蛋分</small><strong id="score">0</strong></div><div class="timer"><span id="time">60</span><small>秒</small></div><button id="pause" class="round" aria-label="暂停游戏"><svg class="icon" aria-hidden="true"><use href="#icon-pause"/></svg></button></div>
    <div id="attention" class="attention" hidden><span id="owner-label"></span><div class="meter" role="meter" aria-label="被发现程度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="suspicion"></i></div></div>
    <div id="targets"></div>
    <button id="fish-paw" class="paw-target" aria-label="拖动猫爪" hidden></button>
    <div id="fish-haul" class="fish-haul" hidden aria-label="本趟收获">
      <div class="haul-slots" aria-hidden="true"><img src="assets/fish-snack.png" alt=""><img src="assets/fish-snack.png" alt=""><img src="assets/fish-snack.png" alt=""></div>
      <strong id="haul-value">0 / 3</strong>
    </div>
    <div id="fish-chances" class="fish-chances" hidden aria-label="剩余机会"><i></i><i></i><i></i></div>
    <div id="jump-streak" class="jump-streak" hidden>0 跳</div>
    <button id="jump-press" aria-label="按住蓄力，松开跳跃" hidden>按住蓄力</button>
    <div id="race-hud" hidden>
      <div class="race-meta"><span>人机竞速</span><strong id="race-distance">900 米</strong></div>
      <div id="race-progress" role="group" aria-label="三只猫的赛程"><i class="race-progress-fill"></i><i data-racer="0" class="you"></i><i data-racer="1"></i><i data-racer="2"></i><b aria-hidden="true">⚑</b></div>
      <div class="race-chain" aria-label="连续通过三组障碍后冲刺"><span aria-hidden="true"><svg class="icon"><use href="#icon-boost"/></svg></span><div class="chain-cells" aria-hidden="true"><i></i><i></i><i></i></div><strong id="race-clean">0 / 3</strong><small>连过冲刺</small></div>
    </div>
    <div id="race-items" class="item-status" hidden aria-label="跑酷道具状态"><span data-race-buff="shield" hidden><img src="assets/item-shield.png" alt="护盾"><b></b></span><span data-race-buff="itemBoost" hidden><img src="assets/item-speed.png" alt="加速"><b></b></span><span data-race-buff="magnet" hidden><img src="assets/item-magnet.png" alt="磁铁"><b></b></span><span data-race-buff="feather" hidden><img src="assets/item-feather.png" alt="轻羽"><b></b></span></div>
    <div id="brawl-hud" hidden>
      <div class="brawl-meta"><span>厨房混战 · 人机</span><strong id="brawl-health-text">100 / 100</strong></div>
      <div id="brawl-health" role="meter" aria-label="你的血量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></div>
      <div id="brawl-items" class="item-status" aria-label="大乱斗道具状态"><span data-brawl-buff="shield" hidden><img src="assets/item-shield.png" alt="护盾"><b></b></span><span data-brawl-buff="power" hidden><img src="assets/item-pepper.png" alt="冲撞强化"><b></b></span><span data-brawl-buff="speed" hidden><img src="assets/item-speed.png" alt="加速"><b></b></span><span data-brawl-buff="glove" hidden><img src="assets/item-glove.png" alt="拳套"><b></b></span><span data-brawl-buff="ice" hidden><img src="assets/item-ice.png" alt="冰棒"><b></b></span><span data-brawl-buff="feather" hidden><img src="assets/item-feather.png" alt="轻羽"><b></b></span></div>
    </div>
    <div id="brawl-controls" hidden role="group" aria-label="大乱斗操作">
      <div id="brawl-move-pad" class="move-pad" role="group" aria-label="按住移动，滑动换方向">
        <button id="brawl-left" aria-label="向左移动，A或左方向键" aria-keyshortcuts="A ArrowLeft"><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg><kbd class="key-hint" aria-hidden="true">A</kbd></button>
        <button id="brawl-right" aria-label="向右移动，D或右方向键" aria-keyshortcuts="D ArrowRight"><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg><kbd class="key-hint" aria-hidden="true">D</kbd></button>
      </div>
      <button id="brawl-drop" aria-label="跳下台面，S或下方向键" aria-keyshortcuts="S ArrowDown"><svg class="icon" aria-hidden="true"><use href="#icon-slide"/></svg><small>下台</small></button>
      <button id="brawl-jump" aria-label="跳跃，空格、K或上方向键" aria-keyshortcuts="Space K ArrowUp"><svg class="icon" aria-hidden="true"><use href="#icon-jump"/></svg><small>跳跃</small><kbd class="key-hint" aria-hidden="true">K / 空格</kbd></button>
      <button id="brawl-attack" aria-label="冲撞攻击，J键" aria-keyshortcuts="J"><svg class="icon paw" aria-hidden="true"><use href="#icon-paw"/></svg><small>冲撞</small><kbd class="key-hint" aria-hidden="true">J</kbd><span class="cooldown-label" aria-hidden="true" hidden></span></button>
    </div>
    <div id="race-controls" hidden role="group" aria-label="跑酷操作">
      <div class="move-pad" role="group" aria-label="左右换道">
        <button id="race-left" aria-label="向左换道，A或左方向键"><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg><kbd class="key-hint" aria-hidden="true">A / ←</kbd></button>
        <button id="race-right" aria-label="向右换道，D或右方向键"><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg><kbd class="key-hint" aria-hidden="true">D / →</kbd></button>
      </div>
      <button id="race-slide" aria-label="钻行，S或下方向键"><svg class="icon" aria-hidden="true"><use href="#icon-slide"/></svg><small>下钻</small><kbd class="key-hint" aria-hidden="true">S / ↓</kbd></button>
      <button id="race-jump" aria-label="跳跃，空格或上方向键"><svg class="icon" aria-hidden="true"><use href="#icon-jump"/></svg><small>跳跃</small><kbd class="key-hint" aria-hidden="true">空格 / ↑</kbd></button>
    </div>
    <div id="tip" class="tip" aria-live="polite" hidden></div>
    <div class="table-route" aria-label="桌面位置"><i id="route-dot"></i></div>
    <div class="play-bottom"><div class="walk-buttons"><button id="move-left" class="round" aria-label="向左走">←</button><button id="move-right" class="round" aria-label="向右走">→</button></div><span id="progress">0 / 12</span><button id="hide" class="pill">躲起来</button><button id="retract" class="pill" hidden>收爪 ↶</button></div>
    <button id="skip" class="text-button" hidden>跳过引导</button>
  </section>
  <section id="match-setup" class="shade" hidden aria-label="选择地图和难度"><div class="paper match-paper"><header><h2 id="match-title">跑一场</h2><button id="match-close" class="round" aria-label="返回主菜单">×</button></header><div id="match-maps" role="group" aria-label="地图"></div><div class="difficulty-choices" role="group" aria-label="难度"><button data-difficulty="casual">休闲</button><button data-difficulty="normal">普通</button><button data-difficulty="hard">困难</button></div><p id="match-record"></p><button id="match-start" class="primary">出发 ▶</button></div></section>
  <section id="paused" class="shade" hidden><div class="paper"><h2>暂停</h2><button id="resume" class="primary">继续</button><button id="pause-home" class="secondary">回到客厅</button><button id="sound-pause" class="text-button sound">关闭声音</button><a href="audio-credits.html" target="_blank" rel="noopener" style="display:block;font-size:12px;color:#776c5e;margin-top:12px">声音署名</a></div></section>
  <section id="result" class="shade" hidden aria-label="本局结算"><div class="confetti" aria-hidden="true"></div><div class="paper result-paper"><div class="result-mark" aria-hidden="true"><svg class="icon"><use href="#icon-cup"/></svg></div><h2 id="result-title"></h2><strong id="result-score">0</strong><span id="result-record" hidden>刷新纪录</span><div id="result-stats"></div><button id="replay" class="primary">再来一次</button><button id="result-home" class="secondary">回到客厅</button></div></section>
</main><script type="module" src="app.js?v=controls-7"></script>
</body></html>
